services:
  - type: web
    name: prhawk-1
    runtime: node
    buildCommand: npm --prefix frontend ci && npm --prefix frontend run build && npm --prefix backend ci
    startCommand: npm --prefix backend start
    healthCheckPath: /api/health
    envVars:
      - key: FRONTEND_ORIGIN
        value: https://pr-hawk.vercel.app
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: MONGODB_URL
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-astra
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
